<svg width="1200" height="490" viewBox="0 0 1200 490" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="capBg" x1="0" y1="0" x2="1200" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16171A"/>
      <stop offset="1" stop-color="#111215"/>
    </linearGradient>

    <linearGradient id="capBorder" x1="0" y1="0" x2="1200" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2C31"/>
      <stop offset="0.5" stop-color="#3A3D45"/>
      <stop offset="1" stop-color="#2A2C31"/>
    </linearGradient>

    <linearGradient id="lineOrange" x1="0" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FF9E4A"/>
    </linearGradient>

    <linearGradient id="linePink" x1="0" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#FF6B9D"/>
    </linearGradient>

    <linearGradient id="linePurple" x1="0" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="lineCyan" x1="0" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05BDF3"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="1198" height="488" rx="20" fill="url(#capBg)" stroke="url(#capBorder)" stroke-width="1.5"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Section Header -->
    <g transform="translate(48, 38)">
      <text x="0" y="0" fill="#6B6E76" font-size="11" font-weight="700" letter-spacing="2.5">ENGINEERING DISCIPLINES</text>
      <text x="0" y="26" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="-0.5">Whole-system architecture across cloud, delivery, security, and data.</text>
    </g>

    <!-- 4 PANELS GRID (2x2) -->
    
    <!-- PANEL 01: DevSecOps & Delivery -->
    <g transform="translate(48, 92)">
      <rect width="536" height="174" rx="16" fill="#1D1F24" stroke="#2A2C31" stroke-width="1.2"/>
      <rect x="28" y="24" width="40" height="3" rx="1.5" fill="url(#lineOrange)"/>
      <text x="28" y="52" fill="#6B6E76" font-size="11" font-weight="700" letter-spacing="2">01 / AUTOMATE &amp; SECURE</text>
      <text x="28" y="82" fill="#FFFFFF" font-size="20" font-weight="750">DevSecOps &amp; Continuous Delivery</text>

      <g transform="translate(28, 102)" font-size="11" font-weight="600">
        <rect x="0" y="0" width="124" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="62" y="17" fill="#A0A3AB" text-anchor="middle">CI/CD PIPELINES</text>

        <rect x="134" y="0" width="86" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="177" y="17" fill="#A0A3AB" text-anchor="middle">GITOPS</text>

        <rect x="230" y="0" width="176" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="318" y="17" fill="#A0A3AB" text-anchor="middle">JFROG PLATFORM &amp; XRAY</text>
      </g>
      <text x="28" y="150" fill="#6B6E76" font-size="13" font-weight="400">Automated build, artifact governance, security scanning, and GitOps controls.</text>
    </g>

    <!-- PANEL 02: Enterprise Security & Zero Trust -->
    <g transform="translate(616, 92)">
      <rect width="536" height="174" rx="16" fill="#1D1F24" stroke="#2A2C31" stroke-width="1.2"/>
      <rect x="28" y="24" width="40" height="3" rx="1.5" fill="url(#linePink)"/>
      <text x="28" y="52" fill="#6B6E76" font-size="11" font-weight="700" letter-spacing="2">02 / PERIMETER &amp; NETWORK</text>
      <text x="28" y="82" fill="#FFFFFF" font-size="20" font-weight="750">Enterprise Security &amp; Zero Trust</text>

      <g transform="translate(28, 102)" font-size="11" font-weight="600">
        <rect x="0" y="0" width="156" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="78" y="17" fill="#A0A3AB" text-anchor="middle">CISCO NETWORKING</text>

        <rect x="166" y="0" width="94" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="213" y="17" fill="#A0A3AB" text-anchor="middle">F5 BIG-IP</text>

        <rect x="270" y="0" width="146" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="343" y="17" fill="#A0A3AB" text-anchor="middle">ZSCALER ZERO TRUST</text>
      </g>
      <text x="28" y="150" fill="#6B6E76" font-size="13" font-weight="400">Strict perimeter defense, WAF, Next-Gen Firewalls, and Zero Trust architecture.</text>
    </g>

    <!-- PANEL 03: Cloud & Platform Infrastructure -->
    <g transform="translate(48, 282)">
      <rect width="536" height="174" rx="16" fill="#1D1F24" stroke="#2A2C31" stroke-width="1.2"/>
      <rect x="28" y="24" width="40" height="3" rx="1.5" fill="url(#linePurple)"/>
      <text x="28" y="52" fill="#6B6E76" font-size="11" font-weight="700" letter-spacing="2">03 / MULTI-CLOUD TOPOLOGY</text>
      <text x="28" y="82" fill="#FFFFFF" font-size="20" font-weight="750">Cloud &amp; Platform Architecture</text>

      <g transform="translate(28, 102)" font-size="11" font-weight="600">
        <rect x="0" y="0" width="70" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="35" y="17" fill="#A0A3AB" text-anchor="middle">AWS</text>

        <rect x="80" y="0" width="128" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="144" y="17" fill="#A0A3AB" text-anchor="middle">GOOGLE CLOUD</text>

        <rect x="218" y="0" width="80" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="258" y="17" fill="#A0A3AB" text-anchor="middle">AZURE</text>

        <rect x="308" y="0" width="148" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="382" y="17" fill="#A0A3AB" text-anchor="middle">TERRAFORM / TOFU</text>
      </g>
      <text x="28" y="150" fill="#6B6E76" font-size="13" font-weight="400">100% reproducible Infrastructure as Code, scalable compute, and resilient networking.</text>
    </g>

    <!-- PANEL 04: Intelligent Automation & Observability -->
    <g transform="translate(616, 282)">
      <rect width="536" height="174" rx="16" fill="#1D1F24" stroke="#2A2C31" stroke-width="1.2"/>
      <rect x="28" y="24" width="40" height="3" rx="1.5" fill="url(#lineCyan)"/>
      <text x="28" y="52" fill="#6B6E76" font-size="11" font-weight="700" letter-spacing="2">04 / OBSERVABILITY &amp; AGENTS</text>
      <text x="28" y="82" fill="#FFFFFF" font-size="20" font-weight="750">Intelligent Automation &amp; Scale</text>

      <g transform="translate(28, 102)" font-size="11" font-weight="600">
        <rect x="0" y="0" width="144" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="72" y="17" fill="#A0A3AB" text-anchor="middle">PROACTIVE TELEMETRY</text>

        <rect x="154" y="0" width="126" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="217" y="17" fill="#A0A3AB" text-anchor="middle">AI DATA AGENTS</text>

        <rect x="290" y="0" width="128" height="26" rx="13" fill="#16171A" stroke="#2A2C31"/>
        <text x="354" y="17" fill="#A0A3AB" text-anchor="middle">EVENT PIPELINES</text>
      </g>
      <text x="28" y="150" fill="#6B6E76" font-size="13" font-weight="400">Real-time observability, event routing, anomaly detection, and automated workflows.</text>
    </g>
  </g>
</svg>
