<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16171A"/>
      <stop offset="1" stop-color="#111215"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2C31"/>
      <stop offset="0.5" stop-color="#3F424A"/>
      <stop offset="1" stop-color="#2A2C31"/>
    </linearGradient>

    <!-- Official Ember Wave Gradient -->
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="50%" stop-color="#FF3D7F"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#16171A" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes waveScroll1 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-80px); }
        100% { transform: translateX(0px); }
      }
      @keyframes waveScroll2 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(70px); }
        100% { transform: translateX(0px); }
      }
      @keyframes waveScroll3 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-50px); }
        100% { transform: translateX(0px); }
      }
      @keyframes waveScroll4 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(60px); }
        100% { transform: translateX(0px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1.0; }
      }
      .wave1 { animation: waveScroll1 10s ease-in-out infinite; }
      .wave2 { animation: waveScroll2 14s ease-in-out infinite; }
      .wave3 { animation: waveScroll3 12s ease-in-out infinite; }
      .wave4 { animation: waveScroll4 16s ease-in-out infinite; }
      .glowing { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="1198" height="458" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="456" rx="19" fill="url(#centerGlow)"/>

  <!-- OFFICIAL OPSBIT BRAND ICON (opsbit-app-icon-dark) -->
  <g transform="translate(562, 38)">
    <rect width="76" height="76" rx="18" fill="#000000" stroke="#2A2C31" stroke-width="1.2"/>
    <!-- Faceted Rabbit Head -->
    <path fill="#FFFFFF" fill-rule="evenodd" transform="translate(16.5, 14) scale(0.44) translate(-10.000 -7.748)" d="M97 112A13 13 0 0 0 110 99L110 36.922A11 11 0 0 0 103.76 27.005L66.924 9.323A16 16 0 0 0 53.076 9.323L16.24 27.005A11 11 0 0 0 10 36.922L10 99A13 13 0 0 0 23 112L26.25 112L42 84L45 68L33 47L27 23L49 38L55 63L84 70.5L88 80L93 86L86 88L87 93L78 96L70.381 96.762L78 112L97 112ZM66 60.5L67.5 44L86 20L81 46L78 63.5L66 60.5ZM62.684 112L69 97L41 86L54 112L62.684 112ZM67.5 81.5L76 78.5L65 74L67.5 81.5Z"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(420, 134)">
    <rect width="360" height="28" rx="14" fill="#1D1F24" stroke="#2A2C31" stroke-width="1"/>
    <text x="180" y="18" fill="#A0A3AB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" text-anchor="middle">PRINCIPAL CLOUD ARCHITECTURE</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="215" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" text-anchor="middle">We hear it first.</text>

  <!-- Subtitle -->
  <text x="600" y="255" fill="#A0A3AB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" letter-spacing="-0.2" text-anchor="middle">Cloud security and architecture that listens before things break.</text>
  <text x="600" y="282" fill="#6B6E76" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Resilient multi-cloud engineering across AWS, GCP &amp; Azure · Fast, quiet, and always one step ahead.</text>

  <!-- SIGNATURE ETHER WAVES ANIMATION (9 Continuous Flowing Hairlines) -->
  <g transform="translate(0, 310)">
    <!-- Wave 1 (Base Ribbon) -->
    <path class="wave1" d="M-100 65 Q 150 25, 400 60 T 900 55 T 1400 65" fill="none" stroke="url(#emberGrad)" stroke-width="0.8" stroke-opacity="0.25"/>
    <path class="wave2" d="M-100 60 Q 200 95, 500 50 T 1000 65 T 1400 50" fill="none" stroke="url(#emberGrad)" stroke-width="1.0" stroke-opacity="0.35"/>
    
    <!-- Wave 2 (Middle Flow) -->
    <path class="wave3" d="M-100 55 Q 180 30, 450 65 T 950 45 T 1400 60" fill="none" stroke="url(#emberGrad)" stroke-width="1.2" stroke-opacity="0.5"/>
    <path class="wave4" d="M-100 50 Q 220 75, 520 40 T 1020 55 T 1400 45" fill="none" stroke="url(#emberGrad)" stroke-width="1.4" stroke-opacity="0.7" filter="url(#glowFilter)"/>
    
    <!-- Central Core Wave -->
    <path class="wave1 glowing" d="M-100 45 Q 250 15, 600 45 T 1100 35 T 1400 45" fill="none" stroke="url(#emberGrad)" stroke-width="1.8" stroke-opacity="0.9" filter="url(#glowFilter)"/>
    
    <!-- Wave 3 (Upper Flow) -->
    <path class="wave2" d="M-100 40 Q 280 65, 580 30 T 1080 45 T 1400 35" fill="none" stroke="url(#emberGrad)" stroke-width="1.4" stroke-opacity="0.7"/>
    <path class="wave3" d="M-100 35 Q 240 10, 540 45 T 1040 30 T 1400 40" fill="none" stroke="url(#emberGrad)" stroke-width="1.2" stroke-opacity="0.5"/>
    <path class="wave4" d="M-100 30 Q 300 50, 620 20 T 1120 40 T 1400 30" fill="none" stroke="url(#emberGrad)" stroke-width="1.0" stroke-opacity="0.35"/>
    <path class="wave1" d="M-100 25 Q 320 5, 660 35 T 1160 25 T 1400 30" fill="none" stroke="url(#emberGrad)" stroke-width="0.8" stroke-opacity="0.25"/>
  </g>

  <!-- Bottom Details Strip -->
  <g transform="translate(600, 428)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6B6E76" letter-spacing="1.5" text-anchor="middle">
    <text>100% INFRASTRUCTURE AS CODE  ·  ZERO-DOWNTIME DELIVERY  ·  ZERO TRUST SECURITY</text>
  </g>
</svg>
